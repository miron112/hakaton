# - name: "SiTV (сайт)"               # sitv.ru — RSS по /rss не открылся
# - name: "URA.RU — ХМАО"             # ura.news — найти региональную RSS
# - name: "ГУ МЧС по ХМАО-Югре"       # 86.mchs.gov.ru — новости, html или rss
