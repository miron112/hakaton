# - name: "Администрация Сургутского района"  # найти Telegram/VK — нужен geo: surgut_district
# - name: "Дума Сургута"              # найти Telegram/VK
#
# VK (этап 6, нужен VK_TOKEN): страницы администрации Сургута, Сургутского района,
