# Источники для «Новостного радара Сургута и Югры»
# Проверено 14.11.2026: каждая лента и канал ниже открывается и обновляется.
#
# Поля:
#   type      — rss | telegram | html | vk
#   geo       — surgut_city | surgut_district | khmao
#   priority  — 1 (первоисточник/ключевой) … 3 (фон)
#   enabled   — false = источник есть в списке, но не опрашивается
#   role      — source (по умолчанию) | own (лента самой редакции: не уведомлять,
#               а использовать для сравнения «это мы уже написали»)
#   note      — комментарий для команды

# ───────────── ЭТАП 2: стартовый набор (проверено) ─────────────

# --- Telegram: первоисточники власти ---
- name: "Администрация города Сургута"
  type: telegram
  handle: admsurgut            # https://t.me/s/admsurgut
  geo: surgut_city
  priority: 1
  enabled: true
  note: "Главный официальный первоисточник по городу"

- name: "Руслан Кухарук — губернатор Югры"
  type: telegram
  handle: kuharuk_ruslan       # https://t.me/s/kuharuk_ruslan
  geo: khmao
  priority: 1
  enabled: true
  note: "Губернатор продвигает канал в MAX — следить, не перестанет ли обновляться Telegram"

- name: "Югра Официально"
  type: telegram
  handle: ugra_official        # https://t.me/s/ugra_official
  geo: khmao
  priority: 2
  enabled: true
  note: "Официальный окружной канал, много PR — хороший тест для фильтра routine_pr"

# --- Telegram: местные СМИ ---
- name: "SiTV | Новости Сургута и Югры"
  type: telegram
  handle: sitvnews             # https://t.me/s/sitvnews
  geo: surgut_city
  priority: 1
  enabled: true
  note: "Городской телеканал, ~23 тыс. подписчиков; конкурент siapress"

- name: "Мой Сургут"
  type: telegram
  handle: Ugra24_Surgut        # https://t.me/s/Ugra24_Surgut
  geo: surgut_city
  priority: 3
  enabled: true
  note: "Небольшой (~900 подписчиков), но пишет про городские темы"

- name: "Сургут LIVE"
  type: telegram
  handle: live24_surgut        # https://t.me/s/live24_surgut
  geo: surgut_city
  priority: 3
  enabled: false
  note: "ШУМНЫЙ: много репостов федеральных и московских новостей. Включить только для проверки, что фильтр географии их отсекает"

# --- RSS ---
- name: "86.ру — новости ХМАО-Югры"
  type: rss
  url: "https://86.ru/rss-feeds/rss.xml"
  geo: khmao
  priority: 2
  enabled: true
  note: "Крупный региональный портал, частые обновления; много лайфстайла — будет шум"

- name: "СИА-ПРЕСС (своя лента)"
  type: rss
  url: "https://siapress.ru/rss"
  geo: surgut_city
  priority: 1
  enabled: true
  role: own
  note: "НЕ уведомлять. Для сравнения: что редакция уже опубликовала и насколько раньше радар нашёл повод. В заголовках бывают лишние переносы строк — делать strip()"


# ───────────── СЛЕДУЮЩИЕ ЭТАПЫ: кандидаты, НЕ ПРОВЕРЕНО ─────────────
# Сайты существуют, но автоматическая проверка не прошла (robots.txt / ошибка доступа).
# Перед включением открыть руками и найти рабочий адрес ленты.
#
